<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.JPG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT-NEO</title>
  </head>
  <body>
    <div id="root">
      <style>
        /* Immediately painted inline styles to prevent initial white screen */
        body {
          margin: 0;
          background-color: #ffffff;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          overflow: hidden;
        }
        .boot-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 2rem;
        }
        .boot-card {
          background-color: #FFD100; /* neoYellow */
          color: #000000;
          border: 8px solid #000000;
          padding: 2rem 4rem;
          font-size: 3rem;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.15em;
          box-shadow: 12px 12px 0px 0px rgba(0,0,0,1);
          transform: rotate(-2deg);
          animation: pulse-card 1.5s infinite ease-in-out;
          margin-bottom: 2rem;
          font-family: inherit;
        }
        .boot-sub {
          font-size: 1.25rem;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          background-color: #00E1FF; /* neoBlue */
          color: #000000;
          border: 4px solid #000000;
          padding: 0.75rem 1.5rem;
          box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
          transform: rotate(1deg);
          animation: flash-sub 1.5s infinite steps(2);
        }
        @keyframes pulse-card {
          0%, 100% {
            transform: rotate(-2deg) scale(1);
          }
          50% {
            transform: rotate(-1deg) scale(1.03);
            box-shadow: 16px 16px 0px 0px rgba(0,0,0,1);
          }
        }
        @keyframes flash-sub {
          0%, 100% {
            background-color: #00E1FF;
          }
          50% {
            background-color: #ADFF00; /* neoGreen */
          }
        }
      </style>
      <div class="boot-container">
        <div class="boot-card">YT-NEO</div>
        <div class="boot-sub">BOOTING PROTOCOLS...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
